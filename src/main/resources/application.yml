spring:
  application:
    name: FlowLink

  datasource:
    url: jdbc:postgresql://postgres:5432/FlowLink_db
    username: FlowLink_user
    password: FlowLink_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false

  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.supplychain: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /logs/flowlink.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB
    
  # Configuration spécifique pour ELK
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB