input {
  file {
    path => "/logs/flowlink.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["flowlink-app"]
  }
}

filter {
  # Parse le format de log Spring Boot standard
  grok {
    match => { 
      "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:thread}\] %{LOGLEVEL:level}%{SPACE}%{DATA:logger} - %{GREEDYDATA:log_message}" 
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  # Timestamp parsing
  if [timestamp] {
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
    }
  }

  # Enrichissement avec métadonnées
  mutate {
    add_field => {
      "service" => "FlowLink"
      "application" => "supplychain"
      "environment" => "docker"
      "[@metadata][index_name]" => "flowlink-logs-%{+YYYY.MM.dd}"
    }
  }

  # Extraction des patterns spécifiques FlowLink - ORDER
  if [log_message] =~ /ORDER-[0-9]+/ {
    grok {
      match => { "log_message" => "(?<order_id>ORDER-[0-9]+)" }
      tag_on_failure => []
    }
    mutate {
      add_tag => [ "order-operation" ]
    }
  }

  # Détection des logs HTTP
  if [logger] == "HTTP" {
    mutate {
      add_tag => [ "http-request" ]
    }
    grok {
      match => { "log_message" => "\[%{WORD:http_method}\] %{URIPATH:uri} %{INT:status:int} - %{DATA:user} - %{INT:duration:int}ms" }
      tag_on_failure => []
    }
  }

  # Détection des logs métier
  if [logger] == "BUSINESS" {
    mutate {
      add_tag => [ "business-event" ]
    }
  }

  # Détection des logs de sécurité
  if [logger] == "SECURITY" or [log_message] =~ /Accès refusé|Access denied|403|401|Authentification/ {
    mutate {
      add_tag => [ "security-event" ]
    }
  }

  # Détection des erreurs de stock
  if [log_message] =~ /Stock insuffisant|insufficient stock/ {
    mutate {
      add_tag => [ "stock-alert" ]
    }
  }

  # Classification par niveau de log
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }
  if [level] == "WARN" {
    mutate {
      add_tag => [ "warning" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    manage_template => false
  }

  # Logs en console pour debugging (optionnel)
  stdout {
    codec => rubydebug
  }
}
