services:
  postgres:
    image: postgres:16-alpine
    container_name: FlowLink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: FlowLink_db
      POSTGRES_USER: FlowLink_user
      POSTGRES_PASSWORD: FlowLink_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - FlowLink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U FlowLink_user -d FlowLink_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: FlowLink-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/FlowLink_db
      SPRING_DATASOURCE_USERNAME: FlowLink_user
      SPRING_DATASOURCE_PASSWORD: FlowLink_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_LIQUIBASE_ENABLED: false
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - FlowLink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 150s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: FlowLink-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@FlowLink.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - FlowLink-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  FlowLink-network:
    driver: bridge